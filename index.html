<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imnovyaz School ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: { 50:'#eff6ff',100:'#dbeafe',200:'#bfdbfe',300:'#93c5fd',400:'#60a5fa',500:'#3b82f6',600:'#2563eb',700:'#1d4ed8',800:'#1e40af',900:'#1e3a8a' },
            accent: { 50:'#f0fdf4',100:'#dcfce7',200:'#bbf7d0',300:'#86efac',400:'#4ade80',500:'#22c55e',600:'#16a34a',700:'#15803d' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 transition-colors duration-200">

  <!-- Login Page -->
  <div id="loginPage" class="min-h-screen flex items-center justify-center bg-gradient-to-br from-primary-600 via-primary-700 to-primary-900 p-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-2xl shadow-lg mb-4">
          <i data-lucide="graduation-cap" class="w-10 h-10 text-primary-600"></i>
        </div>
        <h1 class="text-3xl font-bold text-white">Imnovyaz School</h1>
        <p class="text-primary-200 mt-1">Enterprise Resource Planning System</p>
      </div>
      <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8">
        <h2 class="text-xl font-semibold mb-6 text-center">Sign In</h2>
        <div id="loginError" class="hidden bg-red-50 dark:bg-red-900/30 text-red-600 dark:text-red-400 p-3 rounded-lg mb-4 text-sm"></div>
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1.5">Email</label>
            <div class="relative">
              <i data-lucide="mail" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
              <input id="loginEmail" type="email" placeholder="Enter your email" class="w-full pl-10 pr-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white outline-none transition">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Password</label>
            <div class="relative">
              <i data-lucide="lock" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
              <input id="loginPassword" type="password" placeholder="Enter your password" class="w-full pl-10 pr-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:text-white outline-none transition">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1.5">Login As</label>
            <div class="grid grid-cols-3 gap-2">
              <button onclick="ERP.Auth.setRole('admin')" id="roleAdmin" class="role-btn py-2 px-3 rounded-lg text-sm font-medium border-2 border-primary-500 bg-primary-50 text-primary-700 dark:bg-primary-900/30 dark:text-primary-400 transition">Admin</button>
              <button onclick="ERP.Auth.setRole('teacher')" id="roleTeacher" class="role-btn py-2 px-3 rounded-lg text-sm font-medium border-2 border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-400 hover:border-primary-300 transition">Teacher</button>
              <button onclick="ERP.Auth.setRole('parent')" id="roleParent" class="role-btn py-2 px-3 rounded-lg text-sm font-medium border-2 border-gray-300 dark:border-gray-600 text-gray-600 dark:text-gray-400 hover:border-primary-300 transition">Parent</button>
            </div>
          </div>
          <button onclick="ERP.Auth.login()" class="w-full bg-primary-600 hover:bg-primary-700 text-white py-2.5 rounded-lg font-medium transition shadow-lg shadow-primary-600/30">Sign In</button>
        </div>
        <div class="mt-6 p-4 bg-gray-50 dark:bg-gray-700/50 rounded-lg">
          <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-2">Demo Credentials</p>
          <div class="space-y-1 text-xs text-gray-600 dark:text-gray-300">
            <p><strong>Admin:</strong> admin@imnovyaz.com / admin123</p>
            <p><strong>Teacher:</strong> teacher@imnovyaz.com / teacher123</p>
            <p><strong>Parent:</strong> parent@imnovyaz.com / parent123</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main App -->
  <div id="mainApp" class="hidden min-h-screen flex">
    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebarOverlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="ERP.UI.toggleSidebar()"></div>
    
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-50 w-64 bg-white dark:bg-gray-800 border-r border-gray-200 dark:border-gray-700 transform -translate-x-full lg:translate-x-0 transition-transform duration-200 flex flex-col">
      <div class="p-4 border-b border-gray-200 dark:border-gray-700 flex items-center gap-3">
        <div class="w-10 h-10 bg-primary-600 rounded-xl flex items-center justify-center">
          <i data-lucide="graduation-cap" class="w-5 h-5 text-white"></i>
        </div>
        <div>
          <h2 class="font-bold text-sm">Imnovyaz School</h2>
          <p class="text-xs text-gray-500 dark:text-gray-400" id="sidebarRole">ERP System</p>
        </div>
      </div>
      <nav id="sidebarNav" class="flex-1 overflow-y-auto p-3 space-y-1"></nav>
      <div class="p-3 border-t border-gray-200 dark:border-gray-700">
        <button onclick="ERP.Auth.logout()" class="w-full flex items-center gap-2 px-3 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20 rounded-lg transition">
          <i data-lucide="log-out" class="w-4 h-4"></i> Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col min-h-screen overflow-hidden">
      <!-- Header -->
      <header class="bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 px-4 lg:px-6 py-3 flex items-center justify-between sticky top-0 z-30">
        <div class="flex items-center gap-3">
          <button onclick="ERP.UI.toggleSidebar()" class="lg:hidden p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div>
            <h1 class="text-lg font-semibold" id="pageTitle">Dashboard</h1>
            <p class="text-xs text-gray-500 dark:text-gray-400" id="pageBreadcrumb">Home</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="ERP.UI.toggleTheme()" class="p-2 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition" title="Toggle Theme">
            <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i>
            <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
          </button>
          <div class="flex items-center gap-2 pl-2 border-l border-gray-200 dark:border-gray-700">
            <div class="w-8 h-8 bg-primary-100 dark:bg-primary-900/30 rounded-full flex items-center justify-center">
              <i data-lucide="user" class="w-4 h-4 text-primary-600 dark:text-primary-400"></i>
            </div>
            <div class="hidden sm:block">
              <p class="text-sm font-medium" id="headerUserName">User</p>
              <p class="text-xs text-gray-500 dark:text-gray-400" id="headerUserRole">Role</p>
            </div>
          </div>
        </div>
      </header>

      <!-- Content -->
      <main id="mainContent" class="flex-1 overflow-y-auto p-4 lg:p-6">
        Loading...
      </main>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/50 z-[60] hidden flex items-center justify-center p-4">
    <div id="modalContent" class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto"></div>
  </div>

  <!-- Toast Container -->
  <div id="toastContainer" class="fixed top-4 right-4 z-[70] space-y-2"></div>

  <script src="db.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
